services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: simpliadz-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password1"
      MSSQL_PID: "Developer"
      TZ: "America/Montreal"
    ports:
      - "${MSSQL_PORT:-1433}:1433"

    volumes:
      - simpliadz_mssql_data:/var/opt/mssql

    restart: unless-stopped

volumes:
  simpliadz_mssql_data: